[package]
name = "lumen"
description = "The Lumen compiler: Go's simplicity, Haskell's types, the JVM's runtime"
version.workspace = true
edition.workspace = true

[[bin]]
name = "lumen"
path = "src/main.rs"

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[dependencies]
lumen-api = { path = "../api" }
lumen-diagnostics = { path = "../diagnostics" }
lumen-examples = { path = "../examples" }
lumen-exhaustiveness = { path = "../exhaustiveness" }
lumen-format = { path = "../format" }
lumen-holes = { path = "../holes" }
lumen-ir = { path = "../ir" }
lumen-jvm = { path = "../jvm" }
lumen-modules = { path = "../modules" }
lumen-parser = { path = "../parser" }
lumen-resolver = { path = "../resolver" }
lumen-types = { path = "../types" }
clap = { version = "4", features = ["derive"] } # approved: argument parsing, help and version rendering

[dev-dependencies]
hegeltest = "0.23" # approved: property-based testing, required by AGENTS.md for every phase
lumen-lexer = { path = "../lexer" }

[lints]
workspace = true
