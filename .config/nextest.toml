[profile.default]
test-threads = "num-cpus"

# The runner under `tests/` holds every example, every example line, and every drawn property in
# one JVM, and it starts a JVM for each example that is run. It is one test that does the work of
# the whole Rust suite, so it has a wall of its own, and it runs in the group below.
[[profile.default.overrides]]
filter = "test(=bux_runner::the_runner_holds_the_bux_compiler_to_everything_under_tests)"
slow-timeout = { period = "600s", terminate-after = 1 }
test-group = "bux-command"

# Each of these tests starts a JVM for every example it walks or every case it draws, so what it
# costs is what a JVM start costs rather than what it checks.
# The `bux_*` modules hold a compiler phase written in Bux against the Rust phase it replaces, and
# every further phase of version 0.3 adds one more such module.
# So this entry names the prefix rather than each test, and a phase that lands later is covered on
# the day it lands.
# A wall of 60 s is long enough for a machine under load, and short enough to catch a run that
# hangs.
[[profile.default.overrides]]
filter = """
    test(/^bux_/)
    or test(=examples::every_example_is_accepted_refused_or_run_exactly_as_it_says)
    or test(=collections::a_map_gives_back_the_value_last_put_in_at_each_key)
    or test(=collections::a_set_holds_every_value_put_into_it_and_no_other)
    or test(=collections::hundreds_of_keys_read_back_out_of_a_map_and_a_set_however_many_hash_alike)
    or test(=lists::a_list_grown_by_push_reads_back_at_every_index_it_holds)
    or test(=lists::a_push_leaves_the_list_it_was_handed_holding_what_it_held)
"""
slow-timeout = { period = "60s", terminate-after = 1 }

# The harness of the Bux command line holds every command on every fixture to `lumen`.
# Each of its tests keeps two JVMs and two `lumen` processes busy at once.
# All at once, its tests pushed other `bux_*` tests past their 60 s wall, measured.
# Two at a time, they pushed a drawn `bux_classes` test past the 30 s health check of `hegeltest`.
# One at a time, that drawn test still failed its health check once in two runs, measured.
# So the group holds that drawn test too, and it never runs beside the harness.
# Then the whole suite passes, and each test of the harness ends in under 20 s.
# The bootstrap harness runs the launcher the same way on each program, so the group holds it too.
# It also builds two stages first, so its run of `tests/spec` ends in about 25 s, measured.
[test-groups]
bux-command = { max-threads = 1 }

[[profile.default.overrides]]
filter = """
    test(/^bux_(bootstrap|command|launcher)::/)
    or test(=bux_classes::the_bux_writer_writes_the_rust_bytes_on_drawn_programs)
"""
test-group = "bux-command"

# Every other test has a wall of 10 s. A test that needs longer gets its own entry above this
# catch-all: a name, or a prefix where a family of tests grows with the language, and the reason.
[[profile.default.overrides]]
filter = "all()"
slow-timeout = { period = "10s", terminate-after = 1 }
