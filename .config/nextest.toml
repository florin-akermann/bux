[profile.default]
test-threads = "num-cpus"

# These tests start a JVM for each example they walk or each case they draw, so what they cost is
# what a JVM costs to start rather than what they check, and the cost grows with the repository.
# Their wall is the one that still catches a run that hangs.
[[profile.default.overrides]]
filter = """
    test(=examples::every_example_is_accepted_refused_or_run_exactly_as_it_says)
    or test(=collections::a_map_gives_back_the_value_last_put_in_at_each_key)
    or test(=collections::a_set_holds_every_value_put_into_it_and_no_other)
    or test(=collections::hundreds_of_keys_read_back_out_of_a_map_and_a_set_however_many_hash_alike)
    or test(=lists::a_list_grown_by_push_reads_back_at_every_index_it_holds)
    or test(=lists::a_push_leaves_the_list_it_was_handed_holding_what_it_held)
"""
slow-timeout = { period = "60s", terminate-after = 1 }

# Every other test has a wall of 10 s. A test that needs longer gets its own override, above this
# catch-all, naming the test and the reason.
[[profile.default.overrides]]
filter = "all()"
slow-timeout = { period = "10s", terminate-after = 1 }
