[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

# clippy::pedantic is adopted whole, and `-D warnings` in .cargo/config.toml makes each of its
# lints a hard error. Every lint it reports is fixed in the source; an `allow` lands here only
# with the reason beside it, and `priority = -1` lets such an allow override the group.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[workspace.lints.rust]
unsafe_code = "forbid"
